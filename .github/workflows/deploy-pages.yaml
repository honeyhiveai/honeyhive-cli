# Deploys the VitePress static site under docs/ to GitHub Pages.
#
# Replaces the legacy "Deploy from a branch" Pages experience, which stopped
# auto-triggering for release commits in mid-May 2026 despite docs/ changing
# on every push. Releases are pushed to main by the Propolis GitHub App from
# the hive-kube monorepo; that push now fires this workflow explicitly instead
# of relying on GitHub's opaque legacy build trigger.
#
# Pages source must be set to "GitHub Actions" in repo Settings → Pages for
# this workflow to take effect.

name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/deploy-pages.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deploy; don't cancel in-progress runs so a release
# already mid-deploy completes before the next one starts.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
